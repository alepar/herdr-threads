# The full suite runs under cargo-nextest (AGENTS.md): every test is its own
# process, and tests of different binaries run side by side instead of one
# binary after another as under `cargo test`. The process-wide locks in the
# test binaries (hook_entrypoint's SERIAL, integration's ONE_DAEMON, service's
# IN_PROCESS_DAEMON) cannot span processes; the test groups below keep each
# chain's tests one at a time, as under `cargo test`.

[test-groups]
# Full automatic envelopes exercise the unchanged 250 ms cooperative permits.
automatic-envelope = { max-threads = 1 }
# hook_entrypoint asserts wall-clock hook budgets (1.5 s tool, 5 s lifecycle);
# its spawned hooks starve each other when run together (ht-p03.8).
hook-budget = { max-threads = 1 }
# Tests that ran behind ONE_DAEMON (integration) or IN_PROCESS_DAEMON
# (service): an elected in-process daemon each, several asserting latency
# budgets (100 ms). The long real-time ones (ran_in_own_process) are not in a
# group: under `cargo test` they already ran beside the chain.
integration-daemon = { max-threads = 1 }
service-daemon = { max-threads = 1 }
# The mod delivery sweep (ht-j16.10): each test runs an elected in-process
# daemon with an injected clock and real `watch` children, and one of them
# fills the watch budget. Four at a time keep it from starving the latency-asserting
# daemon tests running beside it; its own waits are generous.
mod-delivery = { max-threads = 4 }
# The Hermes bare-enrollment smoke (ht-4ne.3): each test drives the installed
# bridge under its real 1.2 s pre_llm_call cap against its own isolated Herdr
# server and daemon. Starved beside the suite a callback fails open (no context),
# so the tests run one at a time.
hermes-smoke = { max-threads = 1 }
# The session-binding configuration smoke (ht-54r.19): each test runs a real detached daemon
# against its own isolated Herdr server and waits on the 5 s liveness cadence; one at a time they
# stay inside their own bounds and do not starve the latency-asserting chains beside them.
session-bindings-smoke = { max-threads = 1 }
# The real-daemon sync suites (ht-5fr.23): each test runs several real daemons and
# `peer --stdio` pumps through `sync.dial_command` and waits in real time. Two at a time
# keep them from starving each other and the latency-asserting chains beside them.
sync-daemons = { max-threads = 2 }

[profile.default]
# A hang guard, not a budget: the longest test waits ~70 s by design.
slow-timeout = { period = "60s", terminate-after = 5 }
# Report every failure at the end of the run, not only the first.
fail-fast = false
final-status-level = "slow"
# Most tests wait (IPC, real-time clocks, child processes) rather than
# compute: one test per CPU on the 12-core development Mac kept 12 slots full
# at ~4 busy cores and ran 292 s against the 300 s budget, 18 slots ran 224 s
# at ~5.4 (ht-8jmx). The real-time chains still run alone (threads-required
# below) and the serialized groups are unchanged. A fixed count, not
# per-CPU: on a smaller host set NEXTEST_TEST_THREADS (or -j).
test-threads = 18

# Start the longest tests first, so they overlap the rest of the run instead
# of trailing it: the failpoints check's two release builds, then the tests
# that wait in real time for most of a minute (and the long chains). Only the
# all-slot send chain below starts before them.
[[profile.default.overrides]]
filter = "binary(package) & test(=manifest::failpoints_are_compiled_out_of_release_builds)"
priority = 95
# Its two release builds alone take 274-287 s, against the default guard's 300 s
# (5 x 60 s), and it timed out in every full-suite run. A 480 s guard for this one
# test; the profile default stays. The suite's wall-clock budget is a separate
# issue and is not raised here. No test group: a group of one test serializes nothing.
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = """
binary(integration) & test(/::(herdr_stopped_freezes_wake_lane|herdr_stopped_logs_once_then_capped_summaries|herdr_stopped_costs_one_commit_per_backoff_step|idle_daemon_commits_nothing_from_deadline_wake_request_for_30s|retention_runs_alongside_the_wake_idle_bound|lapsed_reservation_fetch_is_honoured_while_free)$/)
"""
priority = 90

# The six real-time service tests left outside the service-daemon group
# (5-11 s each): the service binary sorts last, so in default order they
# started in the run's final seconds and set its tail (ht-8jmx).
[[profile.default.overrides]]
filter = """
binary(service) & test(/::(elected_health_does_not_keep_verified_host_after_errored_capture|elected_health_keeps_unavailable_host_after_errored_capture|elected_hung_snapshot_keeps_health_deadlines_and_owner_until_physical_join|real_cli_resolve_discards_intent_only_after_correlated_definitive_rejection|elected_driver_periodically_refreshes_without_target_requests|elected_wake_hang_allows_health_deadlines_and_retains_owner_until_joined)$/)
"""
priority = 90

# This CPU-heavy oracle can exceed 90 s on CI. Start it beside the long
# clock-wait tests rather than letting it become a late tail of the run.
[[profile.default.overrides]]
filter = "test(=store::page_fit::tests::differential_matches_greedy_for_every_site)"
priority = 90

# The same for the other CPU-heavy 35-47 s tests: in default order they start
# after ~5400 of ~6100 tests and finish in the run's tail.
[[profile.default.overrides]]
filter = """
binary(herdr-threads) & test(/^(harness::agy::doctor::tests::an_over_cap_brain_is_unbounded_and_limited|harness::agy::witness::tests::a_brain_directory_past_the_cap_reads_as_a_child_and_one_at_the_cap_is_examined|store::queries::tests::query_work_q4::q4_(episode_private_and_reconciliation_points_have_constant_sqlite_work|three_event_keys_and_actual_floor_have_constant_sqlite_work|raw_hundred_scope_charge_and_lazy_due_fourteen_use_actual_helpers))$/)
"""
priority = 90

# The send chain asserts commit-to-wake under 100 ms for three sends; beside
# the full suite's process-heavy tests it missed that budget (120-260 ms) while
# it measures ~15-25 ms alone or under synthetic CPU load. It runs alone, and
# first: queued at its group's priority it waited for every running test to
# finish, and while the minute-long clock-wait tests drained, nextest held every
# lower-priority test back (hosted 37897716203: 1-4 of 7 slots busy for ~50 s).
[[profile.default.overrides]]
filter = "binary(integration) & test(=sweep_remaining::send_commit_wake_under_100ms_with_all_five_lanes)"
threads-required = "num-test-threads"
priority = 100

# The same 100 ms commit-to-wake chain for a single send (194.8 ms beside the
# suite's start-up burst in Main's 90066db1 run), the deadline-commit warning
# kicked-pass-start chain, a send under/after 6,000 settled jobs (333 ms beside the
# suite), and a send with the WAL padded to its auto-checkpoint: alone too, budgets unchanged.
[[profile.default.overrides]]
filter = "binary(integration) & test(/^(lanes_latency::(send_is_attempted_within_100ms_without_a_tick_wait|deadline_commit_creating_a_warning_starts_a_kicked_wake_pass_within_100ms)|sweep_remaining::(send_stays_under_100ms_with_and_after_settled_history|measured_send_window_never_reaches_the_wal_auto_checkpoint))$/)"
threads-required = "num-test-threads"
priority = 100

# The in-process producer-ordering controls assert that the first canonical
# reservation lands under 100 ms after the send's publication commit. Beside
# the suite's process-heavy tests one missed it (143 ms, partial=true; Main
# local 25db37f3 run). They run alone too, at the front with the send chain;
# each takes well under 3 s. The 100 ms bound is unchanged.
[[profile.default.overrides]]
filter = """
binary(integration) & test(/^sweep_remaining::(wake_snapshot_partial_projection_refusal_selects_later_retry|retention_observer_waits_for_correlated_materialization_kick|logical_reservation_before_projection_is_not_a_completed_target_proof|wake_snapshot_preserves_logical_frontier_before_physical_projection)$/)
"""
threads-required = "num-test-threads"
priority = 100

# Tests asserting real-time bounds of 10-250 ms (cancellation within 20 ms,
# manifest return within 10 ms, prompt Ctrl-C, ...): beside the suite they
# missed their bounds on a loaded machine (e.g. 39.8 ms for a 20 ms
# cancellation). They run alone at the front (about 3 s together); every
# bound is unchanged.
[[profile.default.overrides]]
filter = """
test(/::(composer_settle_returns_unknown_when_cancelled|ctrl_c_during_a_call_returns_promptly|nick_cache_render_path_takes_no_context_lock|unreachable_manifest_url_does_not_delay_recording|cancelled_serve_loop_returns_without_polling|elected_health_request_expiry_stops_locked_retirement_read|elected_health_transport_disconnect_cancels_locked_retirement_read|waiting_client_returns_on_cancel|ensure_manifest_returns_within_10ms_with_a_blocked_fetch|ensure_manifest_returns_within_10ms_with_an_unreachable_url|exact_runtime_refresh_ignores_legacy_release_rows_and_remains_async_bounded|cancel_before_wait_returns_immediately|cancel_during_blocking_wait_wakes_it|cancellation_stops_the_blocked_lane_within_20ms|register_then_direct_kick_reaches_the_pacer|cancellation_stops_a_blocked_lane_within_20ms|cancellation_stops_lane_in_backoff_within_20ms|cancel_wakes_and_stops|cancellation_stops_blocked_lane_within_20ms)$/)
"""
threads-required = "num-test-threads"
priority = 100

# This replay chain must first reach agent.start's scripted refusal through
# real native pane reads (750 ms each). A preflight timeout leaves zero starts,
# before the replay assertions are exercised (ht-2b93). Reserve the runner's
# slots at the front, like the other real-time chains; keep every bound intact.
[[profile.default.overrides]]
filter = "binary(integration) & test(=topology_activation::elected_live_registered_phase_replays_recheck_current_caller_recipient_and_payload)"
threads-required = "num-test-threads"
priority = 100

# Registered-resume tests driving the in-process hook with Hermes envelopes:
# each envelope carries the production 1200 ms callback cap for
# pre_llm_call, which the hook must meet against a spawned fixture service.
# At the suite's busy start two missed it ('seat inspect: UnknownOutcome', a
# lost recovery read; local 88f5c69f qualification). They run alone at the
# front (about 11 s together); the cap and every assertion are unchanged.
[[profile.default.overrides]]
filter = """
binary_id(herdr-threads) & test(/^cli::hook::tests::registered_resume::(task52_accepted_kind_replay_and_refused_neighbors_preserve_original_eligibility|task52_facade_declared_reset_clear_has_hot_rows_guidance_and_precise_ack|hermes_qualified_turn_reset_and_rotation_never_infer_resume|registered_fourth_nonresume_never_replays_continuity|startup_enrollment_hermes_qualified_unowned_never_resolves|hermes_qualified_turn_injects_inbox_page_and_defers_lazy_completion)$/)
"""
threads-required = "num-test-threads"
priority = 100

[[profile.default.overrides]]
filter = "binary(hook_entrypoint)"
priority = 80
test-group = "hook-budget"

# Real registered hooks against a spawned fixture service under the
# production lifecycle budget: starved beside the suite, a fixture reply
