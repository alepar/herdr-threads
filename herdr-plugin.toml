id = "herdr-threads"
name = "Threads"
version = "0.2.11"
min_herdr_version = "0.9.1"
description = "Persistent threads and explicit message receipts for Herdr agents"
platforms = ["macos", "linux"]

[[build]]
id = "binary"
command = ["./scripts/build.sh"]

[[startup]]
id = "daemon"
command = ["./scripts/view.sh", "ensure"]

[[actions]]
id = "health"
title = "Threads daemon health"
contexts = ["workspace"]
command = ["./scripts/view.sh", "health"]

[[actions]]
id = "doctor"
title = "Inspect Threads setup"
contexts = ["workspace"]
command = ["./scripts/view.sh", "doctor"]

[[actions]]
id = "ensure"
title = "Ensure Threads daemon"
contexts = ["workspace"]
command = ["./scripts/view.sh", "ensure"]

[[actions]]
id = "stop"
title = "Stop Threads daemon"
contexts = ["workspace"]
command = ["./scripts/view.sh", "stop"]

[[actions]]
id = "view"
title = "Open Threads view"
contexts = ["workspace"]
command = ["./scripts/view.sh", "open"]

[[panes]]
id = "operator"
title = "Threads"
placement = "overlay"
command = ["./scripts/view.sh", "view"]
