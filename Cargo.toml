[package]
name = "herdr-threads"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
test-support = []

# Uses `herdr_threads::test_support::history` (production-writer history
# fixtures), which exists only with the `test-support` feature.
[[test]]
name = "hook_entrypoint"
path = "tests/hook_entrypoint.rs"
required-features = ["test-support"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
clap = { version = "=4.6.4", features = ["derive"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
libc = "=0.2.189"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse", "display"] }

# The Codex schema fingerprint hashes a ~240 MB binary within the version
# observation deadline; unoptimized SHA-256 alone would exceed it in debug
# builds (tests and dev daemons).
[profile.dev.package.sha2]
opt-level = 3
