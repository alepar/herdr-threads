name: CI

# Deterministic checks on Linux x86_64 (Ubuntu 24.04, Herdr 0.9.1): the test
# suite in six parallel shards, plus format, packaging, installer and Python
# suites; clippy on macOS and Linux; release-target build checks (macOS and
# Linux musl) and workflow lint. macOS arm64 runs the same suite locally
# before a merge. herdr-plugin.toml declares platforms ["macos", "linux"].
# Native Codex/Claude model-receipt validation needs an authenticated, isolated
# Herdr environment and is NOT run here; a green run says nothing about it.
# The setup CLI, managed launch and Codex fingerprint admission are covered
# only by their deterministic tests (tests/setup_cli.rs, tests/cli/launch.rs,
# tests/harness/codex_schema.rs, tests/lifecycle_ux.rs); no harness runs here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1
  HERDR_VERSION: 0.9.1
  # macos-aarch64 (manual gates) and linux-x86_64 release assets.
  HERDR_SHA256: 5fc7a7e7adfaca56fa80aa89dcb025693357268dab8285b9ce2d08a2313c89de
  HERDR_LINUX_SHA256: 2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.paths.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changes (unknown bases run all checks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-changed-paths.py
      # The release-document assertions run on every push: a release-record
      # commit (docs/release.md only) skips the heavy jobs.
      - name: Release document assertions
        run: tests/release/docs_test.sh

  tests:
    if: always()
    needs: changes
    name: Tests ${{ matrix.shard }}/${{ strategy.job-total }} (Linux x86_64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The one place the slice count is set: the steps read it back as
        # strategy.job-total (ht-v9v1: five slices; ht-i4tm: six, because runner
        # speed varies ~1.6x between jobs and a slow runner took a fifth to 297 s).
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # ht-p03.131: every process a step starts carries this id, so the final
      # leak check can tell this run's leftovers from anyone else's.
      HT_LEAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-tests-${{ matrix.shard }}
      HT_SWEEP_PANIC_FILE: ${{ github.workspace }}/sweep-panics.log
      # The frozen wire-copy test compares against the v2.1.1 tag: fail, not skip, without it.
      HT_REQUIRE_TAGS: '1'
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'

      - name: Fetch release tags for the frozen wire-copy test
        if: needs.changes.outputs.heavy == 'true'
        run: git fetch --no-tags --depth=1 origin tag v2.1.1 tag v2.0.4

      - name: Python for TOML and fixture tests
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.9'

      - name: zsh for shell round-trip tests
        if: needs.changes.outputs.heavy == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Rust toolchain
        if: needs.changes.outputs.heavy == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
          rustc --version

      - name: Rust dependency cache
        if: needs.changes.outputs.heavy == 'true'
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          # rust-cache adds rustc identity, Cargo.lock/manifests and Cargo/Rust
          # environment hashes, with compatible dependency restore fallbacks.
          # Workspace crates and incremental files are pruned to bound size.
          shared-key: tests-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ matrix.shard == 1 }}

      - name: cargo-nextest (pinned)
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/0.9.146/linux -o nextest.tar.gz
          echo "682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428  nextest.tar.gz" | sha256sum -c -
          tar zxf nextest.tar.gz -C "$HOME/.cargo/bin"
          rm nextest.tar.gz
          cargo nextest --version

      - name: Provision pinned Herdr 0.9.1
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          tool_dir=$(mktemp -d "$RUNNER_TEMP/herdr-$HERDR_VERSION.XXXXXX")
          curl -fsSL --retry 3 --max-time 120 \
            "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64" \
            -o "$tool_dir/herdr"
          printf '%s  %s\n' "$HERDR_LINUX_SHA256" "$tool_dir/herdr" | sha256sum --check
          file "$tool_dir/herdr" | grep -F 'ELF 64-bit LSB pie executable, x86-64'
          chmod 755 "$tool_dir/herdr"
          test "$("$tool_dir/herdr" --version)" = "herdr $HERDR_VERSION"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Locked build
        if: needs.changes.outputs.heavy == 'true'
        # Match nextest's test profile before the strict suite timer starts.
        # cargo build selects dev, so it would not warm optimized test artifacts.
        run: cargo test --locked --all-targets --all-features --no-run

      - name: Tests (parallel, shard ${{ matrix.shard }}/${{ strategy.job-total }})
        if: needs.changes.outputs.heavy == 'true'
        # cargo-nextest, one process per test, every binary in one pool; the
        # serialized chains are test groups in .config/nextest.toml. Every test
        # isolates its own state (ht-zo4, scripts/full-suite-gate). The suite
        # is split round-robin over the sorted test list (slice), so each shard
        # carries about an equal share of the tests; the wall time follows the
        # runner's speed (docs/dev/build-speed.md). Each shard has the five-minute
        # wall-clock budget. --all-features enables `test-support`.
        # The release-proof job owns the exact excluded package test once;
        # no shard cold-builds release fixtures inside this timer. #[ignore] tests (package lifecycle gate,
        # 10^5..10^6 scale tests) do not run here. Herdr policy: provisioned,
        # not skipped (HT_SKIP_HERDR_TESTS is deliberately unset).
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          echo "Runner CPU: $(nproc) x $(lscpu | sed -n 's/^Model name: *//p')"
          start=$(date +%s)
          cargo nextest run --locked --all-targets --all-features --profile ci \
            --partition "slice:$SHARD/$SHARDS" \
            -E 'not (binary(package) & test(=manifest::failpoints_are_compiled_out_of_release_builds))' \
            2>&1 | tee test.log
          elapsed=$(( $(date +%s) - start ))
          echo "Shard $SHARD/$SHARDS wall time: ${elapsed}s (budget: under 300s)"
          if [ "$elapsed" -ge 300 ]; then
            echo "::error::Test shard $SHARD/$SHARDS exceeded the five-minute budget"
            exit 1
          fi

      - name: Skipped Herdr tests (job summary)
        if: always() && needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Isolated-Herdr tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
            echo "Pinned Herdr $HERDR_VERSION provisioned; HT_SKIP_HERDR_TESTS=${HT_SKIP_HERDR_TESTS:-unset}."
            echo 'Skipped by name (empty means none skipped):'
            echo '```'
            grep -ho 'skipped: no herdr[^<&]*' test.log target/nextest/ci/junit.xml 2>/dev/null | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve sweep panic diagnostics
        if: always() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sweep-diagnostics-${{ matrix.shard }}
          path: ${{ env.HT_SWEEP_PANIC_FILE }}
          if-no-files-found: ignore

      - name: No leaked test processes
        # ht-p03.131: every daemon, private Herdr server and helper a test
        # started is gone once its run ends (owner tag, process groups,
        # reaper). Runs even when an earlier step failed.
        if: always() && needs.changes.outputs.heavy == 'true'
        shell: bash
        run: scripts/check-no-leaked-processes --run-id "$HT_LEAK_RUN_ID" --grace 15

  release-proof:
    if: always()
    needs: changes
    name: Release failpoint proof (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'
      - name: Rust toolchain
        if: needs.changes.outputs.heavy == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Rust dependency cache
        if: needs.changes.outputs.heavy == 'true'
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          # rust-cache adds rustc identity, Cargo.lock/manifests and Cargo/Rust
          # environment hashes, with compatible dependency restore fallbacks.
          # Workspace crates and incremental files are pruned to bound size.
          shared-key: release-proof-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          workspaces: |
            . -> target
            . -> target/failpoints-release
            . -> target/failpoints-control

      - name: Release proof (including Rust hook-count and output assertions)
        if: needs.changes.outputs.heavy == 'true'
        # Runs once; cold release builds are outside the shard timers.
        run: cargo test --locked --all-features --test package manifest::failpoints_are_compiled_out_of_release_builds -- --exact --nocapture

  deterministic:
    if: always()
    needs: changes
    name: Format, package, installer, Python suites (Linux x86_64)
    runs-on: ubuntu-24.04
    env:
      HT_LEAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'

      - name: Python for TOML and fixture tests
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.9'

      - name: zsh for shell round-trip tests
        if: needs.changes.outputs.heavy == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Rust toolchain
        if: needs.changes.outputs.heavy == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
          rustc --version

      - name: Provision pinned Herdr 0.9.1
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11)'
          for tool in sh which id file curl sha256sum; do command -v "$tool"; done
          tool_dir=$(mktemp -d "$RUNNER_TEMP/herdr-$HERDR_VERSION.XXXXXX")
          curl -fsSL --retry 3 --max-time 120 \
            "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64" \
            -o "$tool_dir/herdr"
          printf '%s  %s\n' "$HERDR_LINUX_SHA256" "$tool_dir/herdr" | sha256sum --check
          file "$tool_dir/herdr" | grep -F 'ELF 64-bit LSB pie executable, x86-64'
          chmod 755 "$tool_dir/herdr"
          test "$("$tool_dir/herdr" --version)" = "herdr $HERDR_VERSION"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Format
        if: needs.changes.outputs.heavy == 'true'
        run: cargo fmt --all -- --check
      - name: Harness-neutral core check
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-harness-neutral
          python3 -m unittest discover -s scripts/tests -p 'test_check_harness_neutral.py'
      - name: Peer wire compatibility check
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$base" || true
          if git rev-parse --verify -q "origin/$base^{commit}" >/dev/null; then
            scripts/check-wire-compat --base "origin/$base"
          else
            scripts/check-wire-compat
          fi
          python3 -m unittest discover -s scripts/tests -p 'test_check_wire_compat.py'
      - name: Package build script and manifest paths
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh
          test -x bin/herdr-threads
          bin/herdr-threads --version
          python3 - <<'PY'
          import os, tomllib
          with open("herdr-plugin.toml", "rb") as f:
              manifest = tomllib.load(f)
          assert manifest["id"] == "herdr-threads", manifest["id"]
          assert manifest["platforms"] == ["macos", "linux"], manifest["platforms"]
          entries = [e for key in ("build", "startup", "actions", "panes") for e in manifest.get(key, [])]
          assert entries, "manifest declares no commands"
          for entry in entries:
              program = entry["command"][0]
              assert os.path.isfile(program) and os.access(program, os.X_OK), program
          print(f"{len(entries)} manifest commands resolve to executable files")
          PY

      - name: Release installer (offline, stub Herdr)
        if: needs.changes.outputs.heavy == 'true'
        # Packages bin/herdr-threads as fake v0.1.0/v0.1.1 releases served from
        # file:// and drives scripts/install.sh in a scratch HOME: install,
        # idempotent re-run, upgrade, refusals, harness setup and uninstall.
        # Herdr policy: the pinned Herdr provisioned above is on PATH, so the
        # isolated-Herdr matrix runs; HT_SKIP_HERDR_TESTS is deliberately unset
        # (a missing herdr fails the step instead of skipping). Any case that
        # still reports "skipped: no herdr" is listed in the job summary.
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/release/installer_alias_test.py
          python3 tests/release/installer_integrations_test.py
          python3 tests/release/installer_daemon_test.py
          python3 tests/release/installer_terminal_test.py bin/herdr-threads
          python3 tests/release/installer_backup_test.py bin/herdr-threads
          tests/release/install_test.sh bin/herdr-threads 2>&1 | tee install_test.log

      - name: Python demo, validator and canary suites
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for dir in tests/native/support tests/native/cooperative/claude_lifecycle \
                     tests/native/provenance/claude tests/native/provenance/codex \
                     tests/native/demo tests/native/recovery \
                     scripts/tests/validator_corpus; do
            python3 -m unittest discover -s "$dir" -p 'test_*.py'
          done
          # scripts/canary/bisect.py shadows the stdlib `bisect` once the
          # directory leads sys.path, which breaks a whole-directory discover;
          # run each test module on its own.
          for f in scripts/canary/test_*.py; do
            python3 -m unittest discover -s scripts/canary -p "$(basename "$f")"
          done
          python3 -m unittest discover -s scripts/tests -p 'test_check_no_leaked_processes.py'
          python3 -m unittest discover -s scripts/tests -p 'test_herdr_release_smoke.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_qualify.py'
          python3 -m unittest discover -s scripts/tests -p 'test_ci_changed_paths.py'
          python3 -m unittest discover -s scripts/tests -p 'test_linux_e2e_run.py'
          python3 -m unittest discover -s scripts/tests -p 'test_cell_ran_versions.py'
          python3 -m unittest discover -s scripts/tests -p 'test_demo_try_it_camera.py'
          python3 -m unittest discover -s scripts -p 'test_native_hermes_probe.py'
          for d in scripts/agy-fake-gemini scripts/agy-sandbox scripts/agy-relay scripts/agy-gate; do
            if [ -d "$d" ]; then python3 -m unittest discover -s "$d" -p 'test_*.py'; fi
          done

      - name: Skipped Herdr tests (job summary)
        if: always() && needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Isolated-Herdr tests'
            echo "Pinned Herdr $HERDR_VERSION provisioned; HT_SKIP_HERDR_TESTS=${HT_SKIP_HERDR_TESTS:-unset}."
            echo 'Skipped by name (empty means none skipped):'
            echo '```'
            grep -ho 'skipped: no herdr[^<&]*' install_test.log 2>/dev/null | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No leaked test processes
        # ht-p03.131: every daemon, private Herdr server and helper a test or the
        # installer test started is gone once its run ends (owner tag, process
        # groups, reaper). Runs even when an earlier step failed.
        if: always() && needs.changes.outputs.heavy == 'true'
        shell: bash
        run: scripts/check-no-leaked-processes --run-id "$HT_LEAK_RUN_ID" --grace 15

  package-lifecycle:
    name: Package lifecycle gate (private Herdr server; manual)
    # The isolated clean-install gate (docs/validation/package.md). It publishes
    # the committed HEAD to a private bare repository under /private/tmp and
    # drives install/startup/actions/pane/update/link against a private Herdr
    # 0.9.1 server it starts itself. Several minutes, so manual dispatch only.
    # NOT YET RUN ON GITHUB: it has passed only locally (validator 52b0554).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The validator pushes HEAD to a private bare repository; a shallow
          # clone cannot be pushed.
          fetch-depth: 0

      - name: Python for the validator
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.9'
          architecture: arm64

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Provision pinned Herdr 0.9.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          tool_dir=$(mktemp -d "$RUNNER_TEMP/herdr-$HERDR_VERSION.XXXXXX")
          curl -fsSL --retry 3 --max-time 120 \
            "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-macos-aarch64" \
            -o "$tool_dir/herdr"
          printf '%s  %s\n' "$HERDR_SHA256" "$tool_dir/herdr" | shasum -a 256 --check
          chmod 755 "$tool_dir/herdr"
          test "$("$tool_dir/herdr" --version)" = "herdr $HERDR_VERSION"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Package lifecycle gate
        # The `package` target requires the `test-support` feature (its tests
        # spawn children through `test_support::spawn`).
        run: >-
          cargo test --locked --features test-support --test package
          install::clean_package_install_lifecycle
          -- --ignored --exact --nocapture

  herdr-releases:
    name: Herdr release matrix (private Herdr servers; manual)
    # scripts/herdr-release-smoke: the Herdr release matrix (core features,
    # launch and every handoff target, wake and threshold, busy agent, on a
    # hook-running stand-in Codex; docs/validation/herdr-release-matrix.md)
    # against every official Herdr release in tests/herdr-releases.tsv, each
    # binary checksum-verified and each test on its own private IsolatedHerdr
    # server. It first fails when
    # GitHub has an official release >= 0.9.1 that the list lacks (add it with
    # `scripts/herdr-release-smoke --update`). Manual dispatch, like the
    # package gate; optional diagnostic, with local release-qualify evidence
    # satisfying the release gate on the candidate SHA.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HT_LEAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-herdr-releases
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python for the runner
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.9'
          architecture: arm64

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Release list matches GitHub
        run: scripts/herdr-release-smoke --check-upstream

      - name: Release matrix
        shell: bash
        run: |
          set -euo pipefail
          # Short TMPDIR: tests bind Unix sockets (104-byte limit on macOS).
          TMPDIR=$(mktemp -d /tmp/htci.XXXXXX)
          export TMPDIR
          scripts/herdr-release-smoke --cache "$RUNNER_TEMP/herdr-releases" \
            --report "$RUNNER_TEMP/herdr-releases.md"

      - name: Matrix (job summary)
        if: always()
        run: cat "$RUNNER_TEMP/herdr-releases.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  linux-e2e:
    if: always()
    needs: changes
    name: Herdr release smoke and wake-e2e self-test (Linux ${{ matrix.arch }})
    # The no-credential e2e checks on both Linux architectures, every push:
    # scripts/herdr-release-smoke (the Herdr release matrix: core features,
    # launch and every handoff target, wake and threshold, busy agent, on a
    # hook-running stand-in Codex) against every official Herdr release in
    # tests/herdr-releases.tsv, each binary checksum-verified and each test on
    # its own private IsolatedHerdr server, and the wake-e2e driver's
    # --self-test (credential, cleanup, completeness and oracle paths with
    # fakes). The live wake matrix drives authenticated agents and never runs
    # in CI (AGENTS.md "Pre-release wake e2e"); nor does --check-upstream (the
    # manual macOS herdr-releases job owns it, so a new upstream Herdr release
    # does not fail every push).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      HT_LEAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-linux-e2e-${{ matrix.arch }}
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'

      - name: Python for the runner and the driver
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.9'

      - name: lsof and procps for the leak check
        if: needs.changes.outputs.heavy == 'true'
        # scripts/check-no-leaked-processes reads open files with lsof and
        # scans with pgrep (Linux Docker scoping: it fails without lsof).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lsof procps

      - name: Rust toolchain
        if: needs.changes.outputs.heavy == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: wake-e2e driver self-test
        if: needs.changes.outputs.heavy == 'true'
        run: python3 scripts/wake-e2e.py --self-test

      - name: Herdr release matrix
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          # Short TMPDIR: tests bind Unix sockets (108-byte limit on Linux).
          TMPDIR=$(mktemp -d /tmp/htci.XXXXXX)
          export TMPDIR
          # Per-test evidence (stand-in logs, Herdr server log, daemon log and store) for a
          # failing column; uploaded below only on failure.
          export HT_HERDR_MATRIX_EVIDENCE="$RUNNER_TEMP/herdr-matrix-evidence"
          scripts/herdr-release-smoke --cache "$RUNNER_TEMP/herdr-releases" \
            --report "$RUNNER_TEMP/herdr-releases.md" --logs-dir "$RUNNER_TEMP/herdr-matrix-evidence/logs"

      - name: Matrix evidence (on failure)
        if: failure() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-matrix-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/herdr-matrix-evidence
          if-no-files-found: ignore

      - name: Matrix (job summary)
        if: always() && needs.changes.outputs.heavy == 'true'
        run: cat "$RUNNER_TEMP/herdr-releases.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: No leaked test processes
        if: always() && needs.changes.outputs.heavy == 'true'
        shell: bash
        run: scripts/check-no-leaked-processes --run-id "$HT_LEAK_RUN_ID" --grace 15

  clippy:
    # Both OSes: each lints its own platform-gated code.
    if: always()
    needs: changes
    name: Clippy -D warnings (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'
      - name: Rust toolchain
        if: needs.changes.outputs.heavy == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Rust dependency cache
        if: needs.changes.outputs.heavy == 'true'
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          # rust-cache adds rustc identity, Cargo.lock/manifests and Cargo/Rust
          # environment hashes, with compatible dependency restore fallbacks.
          # Workspace crates and incremental files are pruned to bound size.
          shared-key: clippy-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false

      - name: Clippy (default features)
        if: needs.changes.outputs.heavy == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        if: needs.changes.outputs.heavy == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build-targets:
    if: always()
    needs: changes
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both darwin targets build in one macos-15 job: hosted macOS runners
        # sometimes are never acquired (ht-yjhb), so each run asks for as few as
        # it can. `targets` is space-separated.
        include:
          - { name: apple-darwin, targets: aarch64-apple-darwin x86_64-apple-darwin, runner: macos-15 }
          - { name: x86_64-unknown-linux-musl, targets: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { name: aarch64-unknown-linux-musl, targets: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'

      - name: musl toolchain
        if: needs.changes.outputs.heavy == 'true' && contains(matrix.targets, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Rust toolchain
        if: needs.changes.outputs.heavy == 'true'
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a targets <<< "$TARGETS"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal "${targets[@]/#/--target=}"
          rustup default "$RUST_TOOLCHAIN"

      - name: Rust dependency cache
        if: needs.changes.outputs.heavy == 'true'
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          # rust-cache adds rustc identity, Cargo.lock/manifests and Cargo/Rust
          # environment hashes, with compatible dependency restore fallbacks.
          # Workspace crates and incremental files are pruned to bound size.
          shared-key: build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
          cache-bin: false

      - name: Locked release build
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          # Build every target even when one fails, so one failure hides no other.
          failed=()
          for target in "${targets[@]}"; do
            case "$target" in
              *linux-musl)
                # The cc crate builds the bundled SQLite; point it at musl-gcc.
                cc_var="CC_$(printf '%s' "$target" | tr '-' '_')"
                export "$cc_var=musl-gcc"
                ;;
            esac
            cargo build --locked --release --target "$target" || failed+=("$target")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::release build failed for: ${failed[*]}"
            exit 1
          fi

  actionlint:
    if: always()
    needs: [changes, release-proof]
    name: actionlint and workflow assertions
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Validate changed-path detector
        if: always()
        env:
          DETECTOR_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          test "$DETECTOR_RESULT" = success || exit 1
          case "$HEAVY" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.heavy == 'true'

      - name: Install pinned actionlint
        if: needs.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --max-time 120 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        if: needs.changes.outputs.heavy == 'true'
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Workflow assertions
        if: needs.changes.outputs.heavy == 'true'
        run: bash tests/release/workflows_test.sh
      - name: Release proof result
        if: always()
        env:
          PROOF_RESULT: ${{ needs.release-proof.result }}
        run: test "$PROOF_RESULT" = success
