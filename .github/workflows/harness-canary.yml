name: harness-canary

# Daily harness version canary (docs/compatibility/harnesses.md, "Harness canary").
# The pull_request trigger runs the offline selftest job only; the canary job needs the network,
# npm, a Rust build and (optionally) API keys, so it runs on schedule and manual dispatch.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      harness:
        description: Harness to check
        type: string
        default: all
      versions:
        description: latest, since-verified, or a comma-separated version list
        type: string
        default: since-verified
      model_tier:
        description: Tier 1 (model) checks
        type: choice
        options: [auto, off, required]
        default: auto
      runner:
        description: Runner image for the canary job
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
  pull_request:
    paths:
      - scripts/harness-canary.sh
      - scripts/canary/**
      - scripts/harness-canary-selftest/**
      - .github/workflows/harness-canary.yml

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.94.0

jobs:
  selftest:
    name: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Canary self-test (offline)
        run: scripts/harness-canary.sh --self-test
      - name: Issue filing dry-run cases (offline)
        run: python3 scripts/canary/test_file_issues.py
      - name: Manifest writer cases (offline)
        run: python3 -m unittest discover -s scripts/canary -p 'test_manifest.py'

  canary:
    name: canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: selftest
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    concurrency:
      group: harness-canary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Choose the output directory
        run: echo "CANARY_OUT=$RUNNER_TEMP/canary" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build herdr-threads
        run: cargo build --locked
      - name: Fetch the published manifest (candidate baseline)
        run: |
          # The canary's candidate selection reads the harness-manifest branch file; the in-repo file is the
          # fallback until the branch exists. It is a baseline only: the recipes under test stay the in-repo ones.
          baseline="$RUNNER_TEMP/baseline.json"
          if git fetch --depth 1 origin harness-manifest \
            && git show FETCH_HEAD:harness-versions.json > "$baseline"; then
            echo "baseline: harness-manifest branch file"
          else
            echo "::notice::no harness-manifest branch file yet; the in-repo harness-versions.json is the baseline"
            cp docs/compatibility/harness-versions.json "$baseline"
          fi
          echo "BASELINE_JSON=$baseline" >> "$GITHUB_ENV"
      - name: Run canary
        id: canary
        env:
          CANARY_HARNESS: ${{ inputs.harness || 'all' }}
          CANARY_VERSIONS: ${{ inputs.versions || 'since-verified' }}
          CANARY_MODEL_TIER: ${{ inputs.model_tier || 'auto' }}
          # Empty when the secret is absent: tier 1 is then skipped for that harness.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          scripts/harness-canary.sh --harness "$CANARY_HARNESS" --versions "$CANARY_VERSIONS" \
            --bisect --model-tier "$CANARY_MODEL_TIER" --keep --baseline-json "$BASELINE_JSON" --out "$CANARY_OUT"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload report and probe logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-canary-report
          path: |
            ${{ env.CANARY_OUT }}/canary-report.json
            ${{ env.CANARY_OUT }}/summary.md
            ${{ env.CANARY_OUT }}/artifact-index.json
            ${{ env.CANARY_OUT }}/work/**/result.json
            ${{ env.CANARY_OUT }}/work/**/capture-*.json
            ${{ env.CANARY_OUT }}/work/**/legacy/work/**/capture/**
            ${{ env.CANARY_OUT }}/work/**/logs/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Job summary
        if: always()
        run: |
          if [ -f "$CANARY_OUT/summary.md" ]; then cat "$CANARY_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: File issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$CANARY_OUT/canary-report.json" ]; then
            echo "no canary-report.json (the canary failed before writing one); no issues filed"
            exit 0
          fi
          python3 scripts/canary/file_issues.py --report "$CANARY_OUT/canary-report.json" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --write-urls "$CANARY_OUT/issues.json"
      - name: Run the latest release's contract over the probes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The canary keeps one manifest row per live contract: this tree's and the latest release's.
          # Only a release whose `contract-id` cannot answer is recorded as unsupported. An infrastructure
          # failure (release lookup, tag fetch, checkout, build) writes {"tag", "error"}: the manifest keeps the
          # baseline's release-contract rows and this step annotates a warning; it never fails the job.
          if [ ! -f "$CANARY_OUT/canary-report.json" ]; then exit 0; fi
          write_error() {  # $1 tag or empty, $2 reason
            python3 -c 'import json,sys; print(json.dumps({"tag": sys.argv[1] or None, "error": sys.argv[2]}, indent=2))' \
              "$1" "$2" > "$CANARY_OUT/release-contract.json"
          }
          rc=0
          tag=$(gh release view --json tagName -q .tagName 2>"$CANARY_OUT/gh-release.err") || rc=$?
          if [ "$rc" -ne 0 ]; then
            tag=
            if grep -qi 'release not found' "$CANARY_OUT/gh-release.err"; then
              echo "::notice::no release yet; the manifest keeps one live contract"
            else
              reason="gh release view failed (exit $rc): $(tail -c 300 "$CANARY_OUT/gh-release.err" | tr '\n' ' ')"
              echo "::warning::$reason; the manifest keeps the baseline's release-contract rows"
              write_error "" "$reason"
            fi
            exit 0
          fi
          echo "LATEST_RELEASE=$tag" >> "$GITHUB_ENV"
          if [ -z "$tag" ]; then
            echo "::notice::no release yet; the manifest keeps one live contract"
            exit 0
          fi
          if ! git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "::warning::cannot fetch release tag $tag; the manifest keeps the baseline's release-contract rows"
            write_error "$tag" "cannot fetch release tag $tag"
            exit 0
          fi
          scripts/canary/release_contract.sh "$tag" "$CANARY_OUT" \
            || echo "::warning::release contract step failed (exit $?); the manifest keeps the baseline's release-contract rows"
      - name: Write the manifest
        if: always()
        run: |
          if [ ! -f "$CANARY_OUT/canary-report.json" ]; then
            echo "::notice::no canary-report.json; no manifest written"
            exit 0
          fi
          args=(write --baseline "$BASELINE_JSON" --report "$CANARY_OUT/canary-report.json"
            --binary target/debug/herdr-threads --out "$CANARY_OUT/harness-versions.json")
          if [ -f "$CANARY_OUT/issues.json" ]; then args+=(--issue-urls "$CANARY_OUT/issues.json"); fi
          if [ -f "$CANARY_OUT/release-contract.json" ]; then
            args+=(--release-results "$CANARY_OUT/release-contract.json")
          fi
          if [ -n "${LATEST_RELEASE:-}" ]; then args+=(--latest-release "$LATEST_RELEASE"); fi
          python3 scripts/canary/manifest.py "${args[@]}"
      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-canary-manifest
          path: ${{ env.CANARY_OUT }}/harness-versions.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Exit with the canary result
        if: always()
        env:
          CANARY_CODE: ${{ steps.canary.outputs.code }}
        run: exit "${CANARY_CODE:-2}"

  publish-manifest:
    name: publish-manifest
    # The only job with contents: write. It pushes the canary's manifest to the harness-manifest branch by a
    # direct bot commit, and refuses to push unless the repository rulesets protect the default branch and the
    # v* tags (docs/compatibility/harnesses.md, "Manifest publishing"): the token is repo-wide. A manual dispatch
    # from any other branch still runs the canary and uploads the manifest artifact, but never publishes.
    if: >-
      always() && needs.canary.result != 'cancelled' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    needs: canary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: harness-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - name: Check the publishing ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ -z "$default" ] || [ "$GITHUB_REF" != "refs/heads/$default" ]; then
            echo "::error::refusing to publish harness-manifest from $GITHUB_REF: only the default branch (${default:-unknown}) publishes"
            exit 1
          fi
      - name: Download the manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harness-canary-manifest
          path: ${{ runner.temp }}/manifest
        continue-on-error: true
      - name: Check the manifest
        id: manifest
        run: |
          file="$RUNNER_TEMP/manifest/harness-versions.json"
          if [ ! -f "$file" ]; then
            echo "::notice::the canary produced no harness-versions.json; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/canary/manifest.py validate "$file"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Check the repository rulesets
        if: steps.manifest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          # A 403/404 (or any gh failure) counts as "no ruleset": the publish job then refuses to push.
          rulesets="$RUNNER_TEMP/rulesets.json"
          details="$RUNNER_TEMP/rulesets.ndjson"
          : > "$details"
          if ids=$(gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" --jq '.[].id'); then
            for id in $ids; do
              gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" >> "$details" || true
            done
          fi
          jq -s . "$details" > "$rulesets"
          if ! python3 scripts/canary/manifest.py check-ruleset --rulesets-json "$rulesets" --default-branch "$DEFAULT_BRANCH"; then
            echo "::error::refusing to push to harness-manifest: the repository needs an active ruleset protecting the default branch against deletion and force-push, and one protecting refs/tags/v* against deletion and update (docs/compatibility/harnesses.md, 'Manifest publishing')"
            exit 1
          fi
      - name: Commit to the harness-manifest branch
        if: steps.manifest.outputs.publish == 'true'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          if git fetch --depth 1 origin harness-manifest; then
            git worktree add --detach "$work" FETCH_HEAD
            cd "$work"
          else
            git worktree add --detach "$work"
            cd "$work"
            git checkout --orphan harness-manifest
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/manifest/harness-versions.json" harness-versions.json
          git add harness-versions.json
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "harness-manifest is already up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "harness-manifest: canary run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/harness-manifest
